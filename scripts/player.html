<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17253a"><title>朝と夜の車内ラジオ</title>
<style>body{font-family:system-ui,-apple-system,sans-serif;background:#f5f7fb;color:#1c2633;margin:0;padding:30px 14px}main{max-width:560px;margin:auto;background:white;padding:25px;border-radius:20px;box-shadow:0 8px 24px #17253a10}h1{font-size:1.55rem}p{line-height:1.7}audio{width:100%;margin:16px 0}a{color:#1656a2}.small{color:#69788c;font-size:.85rem}.warn{background:#fff3d9;border-radius:10px;padding:12px}button{padding:12px 18px;margin:4px;border:1px solid #aab8cb;border-radius:12px;background:white;color:#17253a;font:inherit}button[aria-pressed=true]{background:#17253a;color:white}</style></head>
<body><main><h1>🎧 朝と夜の車内ラジオ</h1><p class="small">日本時間17時前は朝、17時以降は夜を選びます。</p>
<nav aria-label="番組を選ぶ"><button id="morning" aria-pressed="false">☀ 朝のニュース</button><button id="evening" aria-pressed="false">☾ 夜のひとやすみ</button></nav>
<h2 id="title"></h2><p id="info" aria-live="polite">更新情報を確認しています…</p><p class="warn" id="warning" hidden></p>
<audio id="audio" controls preload="metadata"></audio><p id="links" hidden><a id="download">MP3を開く・保存する</a> / <a id="script">原稿を読む</a></p>
<p class="small">再生ボタンを押してお聴きください。朝・夜は手動でも選べます。再生中に番組が自動で切り替わることはありません。</p></main>
<script>
const parts = Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).map(p=>[p.type,p.value]));
const today = `${parts.year}-${parts.month}-${parts.day}`;
const requested = new URLSearchParams(location.search).get('episode');
let selected = ['morning','evening'].includes(requested) ? requested : (Number(parts.hour)>=17?'evening':'morning');
let episodes = {};
function select(episode) {
 selected=episode;
 const meta=episodes[episode], stem=episode==='morning'?'today':'evening';
 document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.id===episode)));
 document.getElementById('title').textContent=episode==='morning'?'朝のニュース':'夜のひとやすみ';
 const audio=document.getElementById('audio'), warning=document.getElementById('warning');
 audio.pause(); audio.removeAttribute('src'); audio.load();
 document.getElementById('links').hidden=!meta;
 warning.hidden=true;
 if(!meta){document.getElementById('info').textContent='この番組の音声はまだ公開されていません。別の番組をお選びください。';return;}
 document.getElementById('info').textContent=`原稿更新日：${meta.date_jst}`+(meta.duration_seconds?` ／ 約${Math.round(meta.duration_seconds/60)}分`:'');
 if(meta.date_jst!==today || meta.retained){warning.textContent='最新音声の更新を確認できません。表示の日付の音声です。';warning.hidden=false;}
 const url=`${stem}.mp3?v=${encodeURIComponent(meta.audio_sha256||meta.generated_at_jst)}`;
 audio.src=url;
 document.getElementById('download').href=url;
 document.getElementById('script').href=`${stem}.txt?v=${encodeURIComponent(meta.generated_at_jst)}`;
}
for(const id of ['morning','evening'])document.getElementById(id).onclick=()=>select(id);
fetch('episodes.json?v='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json();}).then(data=>{episodes=data;select(selected);}).catch(()=>{document.getElementById('info').textContent='更新情報を取得できませんでした。通信状態を確認し、再読み込みしてください。';});
</script></body></html>
