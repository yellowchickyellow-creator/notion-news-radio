name: 毎朝のニュース音声を作る

on:
  schedule:
    # Notionの7:00更新後。GitHub Actionsの予約実行には遅延・欠落の可能性があります。
    - cron: '27 7 * * *'
      timezone: 'Asia/Tokyo'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: daily-news-radio
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: コード取得
        uses: actions/checkout@v4
      - name: Python準備
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: 依存ライブラリ
        run: python -m pip install -r requirements.txt
      - name: Notionから当日の原稿を取得してMP3生成
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
          TTS_VOICE: ja-JP-NanamiNeural
          TTS_RATE: '+0%'
        run: python scripts/build_audio.py
      - name: Pagesを設定
        uses: actions/configure-pages@v5
      - name: 公開用ファイルをアップロード
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: ニュースラジオ公開
        id: deployment
        uses: actions/deploy-pages@v4
