name: 毎朝のニュース音声を作る

on:
  schedule:
    # Notionの7:00更新後。GitHub Actionsの予約実行には遅延・欠落の可能性があります。
    - cron: '27 7 * * *'
      timezone: 'Asia/Tokyo'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: daily-news-radio
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: コード取得
        uses: actions/checkout@v4
      - name: Python準備
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: 依存ライブラリ
        run: |
          python -m pip install -r requirements.txt
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            # Use only the runner's signed Ubuntu sources for Ubuntu packages.
            apt_sources=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o Acquire::Retries=3)
            sudo apt-get "${apt_sources[@]}" update
            sudo apt-get "${apt_sources[@]}" install -y ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - name: 全文取得・番組分離の検証
        run: |
          python -m unittest discover -s tests -v
          node tests/player.test.cjs
      - name: Notionから当日の原稿を取得してMP3生成
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
          NOTION_EVENING_PAGE_ID: '424c2f0d-3b78-81d7-82ab-ee281bf1ffb1'
          BGM_ENABLED: 'true'
          TTS_VOICE: ja-JP-NanamiNeural
          TTS_RATE: '+0%'
        run: python scripts/radio.py
      - name: Pagesを設定
        uses: actions/configure-pages@v5
      - name: 公開用ファイルをアップロード
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: ニュースラジオ公開
        id: deployment
        uses: actions/deploy-pages@v4
      - name: 公開内容の検証
        run: python scripts/verify_public.py
      - name: 番組ごとの更新結果
        if: ${{ !cancelled() && hashFiles('build-report.json') != '' }}
        run: |
          python -c "import json; from pathlib import Path; p=Path('build-report.json'); assert p.exists(), '生成処理が完了していません'; r=json.loads(p.read_text()); assert not r['failures'], '更新失敗（公開可能な旧音声は維持）: '+str(r['failures'])"
